<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: var(--font-sans);
    }

    .sim {
        padding: 1rem 0;
    }

    .phase-bar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
    }

    .phase-pill {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11px;
        border: 0.5px solid var(--color-border-tertiary);
        color: var(--color-text-secondary);
        background: var(--color-background-secondary);
    }

    .phase-pill.active {
        background: var(--color-background-primary);
        border-color: var(--color-border-primary);
        color: var(--color-text-primary);
        font-weight: 500;
    }

    .phase-pill.done {
        opacity: 0.45;
    }

    .gm-box {
        background: var(--color-background-secondary);
        border: 0.5px solid var(--color-border-tertiary);
        border-radius: var(--border-radius-lg);
        padding: 1rem 1.25rem;
        margin-bottom: 1.25rem;
    }

    .gm-label {
        font-size: 11px;
        color: var(--color-text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
    }

    .gm-text {
        font-size: 15px;
        color: var(--color-text-primary);
        line-height: 1.5;
    }

    .phones {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin-bottom: 1.25rem;
    }

    .phone {
        background: var(--color-background-primary);
        border: 0.5px solid var(--color-border-tertiary);
        border-radius: 10px;
        padding: 8px;
        min-height: 130px;
        display: flex;
        flex-direction: column;
    }

    .phone-name {
        font-size: 10px;
        font-weight: 500;
        color: var(--color-text-secondary);
        margin-bottom: 6px;
        padding-bottom: 5px;
        border-bottom: 0.5px solid var(--color-border-tertiary);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .phone-badge {
        font-size: 9px;
        padding: 1px 5px;
        border-radius: 8px;
    }

    .badge-wolf {
        background: #FAECE7;
        color: #993C1D;
    }

    .badge-dokter {
        background: #E1F5EE;
        color: #0F6E56;
    }

    .badge-detektif {
        background: #E6F1FB;
        color: #185FA5;
    }

    .badge-warga {
        background: #F1EFE8;
        color: #5F5E5A;
    }

    .phone-screen {
        flex: 1;
        font-size: 10px;
        line-height: 1.5;
        color: var(--color-text-primary);
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .phone-screen.dark {
        background: #111;
        border-radius: 6px;
        padding: 6px;
        margin-top: 4px;
        color: #eee;
    }

    .screen-action {
        font-size: 9px;
        font-weight: 500;
        margin-bottom: 4px;
    }

    .screen-muted {
        font-size: 9px;
        color: #888;
    }

    .screen-btn {
        display: inline-block;
        margin-top: 5px;
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 9px;
        border: 0.5px solid #555;
        color: #ccc;
        text-align: center;
    }

    .screen-btn.active-btn {
        border-color: #E24B4A;
        color: #E24B4A;
    }

    .screen-btn.green-btn {
        border-color: #1D9E75;
        color: #1D9E75;
    }

    .screen-btn.blue-btn {
        border-color: #378ADD;
        color: #378ADD;
    }

    .dead-overlay {
        position: relative;
    }

    .dead-overlay::after {
        content: "MATI";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 500;
        color: #fff;
        z-index: 2;
    }

    .nav-row {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .nav-btn {
        padding: 6px 14px;
        border-radius: var(--border-radius-md);
        border: 0.5px solid var(--color-border-secondary);
        background: var(--color-background-primary);
        color: var(--color-text-primary);
        font-size: 13px;
        cursor: pointer;
    }

    .nav-btn:disabled {
        opacity: 0.35;
        cursor: default;
    }

    .nav-btn.primary {
        background: var(--color-text-primary);
        color: var(--color-background-primary);
        border-color: var(--color-text-primary);
    }

    .step-counter {
        font-size: 12px;
        color: var(--color-text-secondary);
        margin-left: auto;
    }

    .highlight {
        background: var(--color-background-info);
        color: var(--color-text-info);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 11px;
    }

    .voter-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 4px;
    }

    .vote-item {
        display: flex;
        justify-content: space-between;
        font-size: 9px;
    }

    .vote-bar-wrap {
        height: 4px;
        background: #333;
        border-radius: 2px;
        margin-top: 1px;
    }

    .vote-bar {
        height: 4px;
        background: #E24B4A;
        border-radius: 2px;
    }

    .announce-box {
        text-align: center;
        padding: 8px 4px;
    }

    .big-icon {
        font-size: 22px;
        margin-bottom: 4px;
        display: block;
    }

    .result-box {
        border: 0.5px solid var(--color-border-tertiary);
        border-radius: 8px;
        padding: 8px 12px;
        margin-top: 8px;
        text-align: center;
        background: var(--color-background-secondary);
    }
</style>

                    content: makeScreen([`<div class="announce-box"><div style="font-size:9px;color:#E24B4A;font-weight:500">SERIGALA</div><div class="screen-muted" style="margin-top:2px">Kalah :(</div></div>`], true)
                },
                {
                    header: "Ani", badge: { label: "Dokter", cls: "badge-dokter" },
                    content: makeScreen([`<div class="announce-box"><div style="font-size:9px;color:#1D9E75;font-weight:500">DOKTER</div><div class="screen-muted" style="margin-top:2px">Menang!</div></div>`], true)
                },
                {
                    header: "Ciko", badge: { label: "Detektif", cls: "badge-detektif" },
                    content: makeScreen([`<div class="announce-box"><div style="font-size:9px;color:#378ADD;font-weight:500">DETEKTIF</div><div class="screen-muted" style="margin-top:2px">Menang!</div></div>`], true)
                },
                {
                    header: "Dina", badge: { label: "Warga", cls: "badge-warga" },
                    content: makeScreen([`<div class="announce-box"><div style="font-size:9px;color:#5F5E5A;font-weight:500">WARGA</div><div class="screen-muted" style="margin-top:2px">Menang!</div></div>`], true)
                },
                {
                    header: "Eko", badge: { label: "Warga", cls: "badge-warga" },
                    content: makeScreen([`<div class="announce-box"><div style="font-size:9px;color:#5F5E5A;font-weight:500">WARGA</div><div class="screen-muted" style="margin-top:2px">Menang!</div></div>`], true)
                },
            ]
        },
    ];

    const STEP_LABELS = [
        "1. Lobby & Join Room",
        "2. Bagi Peran (rahasia)",
        "3a. Malam 1: Giliran Werewolf",
        "3b. Malam 1: Giliran Dokter",
        "3c. Malam 1: Giliran Detektif",
        "4. Pagi Hari",
        "5. Diskusi",
        "6a. Voting: Pilih",
        "6b. Voting: Hasil",
        "7. Malam Ke-2",
        "8. Game Over",
    ];

    let cur = 0;

    function render() {
        const s = STEPS[cur];

        const pb = document.getElementById("phasebar");
        pb.innerHTML = STEP_LABELS.map((l, i) =>
            `<span class="phase-pill${i === cur ? " active" : i < cur ? " done" : ""}">${l}</span>`
        ).join("");

        document.getElementById("gmtext").innerHTML = s.gm + (s.note ? `<div style="margin-top:6px;font-size:13px;color:var(--color-text-secondary)">💡 ${s.note}</div>` : "");

        const ph = document.getElementById("phones");
        ph.innerHTML = s.screens.map(sc =>
            `<div class="phone${sc.dead ? " dead-overlay" : ""}">
      <div class="phone-name">
        ${sc.header}
        ${sc.badge ? `<span class="phone-badge ${sc.badge.cls}">${sc.badge.label}</span>` : ""}
      </div>
      ${sc.content}
    </div>`
        ).join("");

        document.getElementById("prevBtn").disabled = cur === 0;
        document.getElementById("nextBtn").disabled = cur === STEPS.length - 1;
        document.getElementById("nextBtn").textContent = cur === STEPS.length - 1 ? "Selesai ✓" : "Lanjut →";
        document.getElementById("stepctr").textContent = `${cur + 1} / ${STEPS.length}`;
    }

    function move(dir) {
        cur = Math.max(0, Math.min(STEPS.length - 1, cur + dir));
        render();
    }

    render();
</script>
